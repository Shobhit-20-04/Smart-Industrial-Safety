# Explicit Semantic Cross-Dataset Class Mapping Configuration
# Smart Industrial Safety Monitoring System - M.Tech CSE Research Project
# 
# Purpose:
# Align disparate dataset taxonomies into unified semantic PPE concepts.
# NEVER compare raw integer class IDs directly across datasets.

source_model: "SH17 Trained YOLOv8s"

sh17_classes:
  0: "person"
  1: "ear"
  2: "ear-mufs"
  3: "face"
  4: "face-guard"
  5: "face-mask-medical"
  6: "foot"
  7: "tools"
  8: "glasses"
  9: "gloves"
  10: "helmet"
  11: "hands"
  12: "head"
  13: "medical-suit"
  14: "shoes"
  15: "safety-suit"
  16: "safety-vest"

chv_classes:
  0: "person"
  1: "vest"
  2: "blue helmet"
  3: "red helmet"
  4: "white helmet"
  5: "yellow helmet"

chvg_classes:
  0: "person"
  1: "vest"
  2: "blue"
  3: "red"
  4: "white"
  5: "yellow"
  6: "head"
  7: "glass"

# ====================================================================
# SH17 -> CHV Cross-Domain Semantic Alignment
# Common PPE Concepts: ['helmet', 'person', 'vest']
# ====================================================================
sh17_to_chv:
  predictions:
    "person": "person"
    "safety-vest": "vest"
    "helmet": "helmet"
  ground_truth:
    "person": "person"
    "vest": "vest"
    "blue helmet": "helmet"
    "red helmet": "helmet"
    "white helmet": "helmet"
    "yellow helmet": "helmet"
  rationale: >
    SH17 detects 'helmet' as a single class, whereas CHV annotates 4 color-differentiated
    helmet classes ('blue helmet', 'red helmet', 'white helmet', 'yellow helmet').
    To assess PPE compliance transferability, these are semantically aggregated into 'helmet'.
    SH17 'safety-vest' directly corresponds to CHV 'vest'.
    SH17 'person' directly corresponds to CHV 'person'.

# ====================================================================
# SH17 -> CHVG Cross-Domain Semantic Alignment
# Common PPE Concepts: ['glasses', 'head', 'helmet', 'person', 'vest']
# ====================================================================
sh17_to_chvg:
  predictions:
    "person": "person"
    "safety-vest": "vest"
    "helmet": "helmet"
    "head": "head"
    "glasses": "glasses"
  ground_truth:
    "person": "person"
    "vest": "vest"
    "blue": "helmet"
    "red": "helmet"
    "white": "helmet"
    "yellow": "helmet"
    "head": "head"
    "glass": "glasses"
  rationale: >
    CHVG annotates helmets by color alone ('blue', 'red', 'white', 'yellow'), which are aggregated
    into the unified concept 'helmet'.
    CHVG 'glass' semantically matches SH17 'glasses' (eye protection).
    CHVG 'head' directly aligns with SH17 'head' (anatomical anchor).
    CHVG 'vest' corresponds to SH17 'safety-vest'.
    CHVG 'person' corresponds to SH17 'person'.
